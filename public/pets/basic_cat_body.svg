<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="catBodyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </radialGradient>
    <radialGradient id="catDarkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </radialGradient>
  </defs>

  <ellipse cx="60" cy="110" rx="30" ry="6" fill="rgba(0,0,0,0.15)" />

  <!-- Tail -->
  <path d="M 80 80 Q 110 90 100 50 Q 90 60 85 80 Z" fill="url(#catDarkGrad)" />

  <!-- Body -->
  <ellipse cx="60" cy="85" rx="28" ry="24" fill="url(#catBodyGrad)" />
  <ellipse cx="60" cy="90" rx="20" ry="18" fill="#F3F4F6" />
  
  <!-- Pointy Ears -->
  <polygon points="35,25 25,10 45,15" fill="url(#catDarkGrad)" />
  <polygon points="36,23 30,15 41,18" fill="#FCA5A5" />
  <polygon points="85,25 95,10 75,15" fill="url(#catDarkGrad)" />
  <polygon points="84,23 90,15 79,18" fill="#FCA5A5" />

  <!-- Head -->
  <ellipse cx="60" cy="45" rx="26" ry="22" fill="url(#catBodyGrad)" />
  <path d="M 45 35 Q 60 50 75 35 Z" fill="url(#catDarkGrad)" opacity="0.3" /> <!-- Striping -->
  
  <!-- Tiny Snout -->
  <polygon points="56,48 64,48 60,52" fill="#FCA5A5" />
</svg>
