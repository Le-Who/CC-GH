<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Game Hub Telegram Mini App</title>
    <!--APP_VERSION_INJECT-->
    <!-- Theme flash prevention — applies before first paint -->
    <script>
      try {
        var t = localStorage.getItem("hub_theme") || "auto";
        if (t === "seasonal") {
          var m = new Date().getMonth();
          t =
            m >= 2 && m <= 4
              ? "soft-fantasy"
              : m >= 5 && m <= 7
                ? "cozy-day"
                : "neon-night";
        }
        if (t === "auto")
          t = matchMedia("(prefers-color-scheme: light)").matches
            ? "cozy-day"
            : "neon-night";
        if (t !== "neon-night")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="version-badge" class="hidden">{{APP_VERSION}}</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
