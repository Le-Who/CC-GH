<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mochi combined media QA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ebdb;color:#34433a;font:14px system-ui}body{display:flex;flex-direction:column}header{padding:9px 12px 5px}h1{font-size:17px;margin:0}header p{margin:3px 0;font-size:12px}nav{display:flex;flex-wrap:wrap;gap:5px;padding:5px 10px}button{min-width:44px;min-height:44px;padding:7px 11px;border:1px solid #9caa91;background:#f8f7ee;border-radius:8px;color:inherit;font:inherit}button:focus-visible{outline:3px solid #396e4d}.seek{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px}.seek input{min-width:0;flex:1;height:44px}canvas{display:block;width:100%;min-height:80px;flex:1;background:radial-gradient(ellipse at 55% 70%,#d2dfb6,#e7ebdc)}footer{padding:4px 10px;font-size:11px;min-height:20px}#state{white-space:normal;overflow-wrap:anywhere}@media(max-height:420px){header p{display:none}header{padding:4px 10px}h1{font-size:14px}nav{padding-top:2px;padding-bottom:2px}button{padding:4px 8px}.seek{height:44px}.seek input{height:44px}footer{font-size:10px}}
