<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pip source visit QA</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7f1e5;color:#354a39;font:14px system-ui,sans-serif}body{display:grid;grid-template-rows:auto minmax(100px,1fr) auto auto;min-width:0}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px}header strong{font-size:16px}header small{margin-left:auto;color:#69765f}.stage{position:relative;min-height:0;overflow:hidden;background:#a6bd6a}.stage img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:52% 50%}.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.controls{display:flex;gap:5px;flex-wrap:wrap;padding:6px 8px}button,select{min-height:44px;min-width:44px;border:1px solid #d1cbb9;border-radius:9px;color:#354a39;background:#fffaf0;padding:6px 9px;font:inherit;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid #b78a43}label{display:flex;align-items:center;gap:6px}input[type=range]{min-width:80px;width:100%;height:44px}.timeline{padding:0 10px;display:grid;grid-template-columns:minmax(80px,1fr) 70px;align-items:center;gap:8px}output{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}#status{padding:5px 10px;background:#e8eddd;min-height:28px;overflow-wrap:anywhere;font-size:11px}#status[data-error=true]{background:#f5ddce;color:#823b25}@media(max-height:450px)and(min-aspect-ratio:8/5){body{grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:auto minmax(0,1fr) auto}.stage{grid-column:1;grid-row:2/4}.controls{grid-column:2;grid-row:1/3;align-content:start;overflow:auto}.timeline{grid-column:2;grid-row:3}#status{grid-row:4;grid-column:1/3}header{grid-column:1}header small{display:none}}
</style></head><body><header><strong>Pip · source visit QA</strong><small>Closed candidate · 40 ms</small></header><main class="stage"><img src="public/background.webp" alt=""><canvas aria-label="Pip's complete yard visit"></canvas></main><section class="controls" aria-label="Visit controls"><button id="play">Play</button><button id="restart">Restart</button><button id="step">+40 ms</button><select id="phase" aria-label="Jump to phase"><option value="approach">Approach</option><option value="action">Interaction start</option><option value="nibble" selected>Nibble</option><option value="back">Back away</option><option value="turn">Turn</option><option value="rest">Rest loop</option><option value="seam">Rest seam</option><option value="depart">Departure</option><option value="done">Complete</option></select><select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="4">4×</option></select><button id="delay">Delay decode</button><button id="fail">Fail one page</button><button id="retry">Retry / clear</button></section><section class="timeline"><input id="time" aria-label="Visit time" type="range" min="0" max="180000" step="40"><output id="timeLabel">0.00 s</output></section><div id="status" role="status">Loading the calibrated source fixture…</div><script type="module" src="source/src/games/companion-yard-v2/pip-fixture.mjs"></script></body></html>
