name: Bounded browser evidence
description: Preserve original browser evidence in separately retrievable review, video and trace artifacts.
inputs:
  group:
    description: Validated browser CI group
    required: true
  include-hidden-files:
    description: Include indexed hidden evidence files for explicitly scoped groups.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Partition evidence without dropping bytes
      shell: bash
      env:
        BROWSER_GROUP: ${{ inputs.group }}
      run: node scripts/collect-browser-ci-evidence.mjs "$BROWSER_GROUP"
    - name: Preserve review-01
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: game-hub-browser-${{ inputs.group }}-review-01-${{ github.sha }}-${{ github.run_attempt }}
        path: browser-evidence/review-01/
        if-no-files-found: ignore
        include-hidden-files: ${{ inputs.include-hidden-files }}
        compression-level: 0
        retention-days: 14
    - name: Preserve review-02
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: game-hub-browser-${{ inputs.group }}-review-02-${{ github.sha }}-${{ github.run_attempt }}
