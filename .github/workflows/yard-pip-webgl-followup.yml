name: Bounded Pip direct and depth follow-up
on:
  push:
    branches: ['qa/yard-pip-webgl-followup-20261006']
permissions:
  contents: read
concurrency:
  group: pip-webgl-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-followup:
    if: github.run_attempt == 1 && github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /qa/yard-pip-webgl/
      - name: Verify immutable parent and existing native QA utilities
        run: |
          test "$(git rev-parse HEAD^)" = 3ac1558f8971016780ffbd227fbfca5f0de61a93
          command -v xvfb-run
          command -v ffmpeg
          command -v ffprobe
          node qa/yard-pip-webgl/followup/run.mjs --verify-only
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked ordinary QA dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: One bounded headed Chromium pass under existing Xvfb
        timeout-minutes: 4
        run: xvfb-run -a node qa/yard-pip-webgl/followup/run.mjs
      - name: Enforce aggregate eight MiB evidence cap
        id: cap
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/yard-pip-webgl/followup-results')
          total=sum(f.stat().st_size for f in p.rglob('*') if f.is_file())
          assert total <= 8*1024*1024, 'Evidence exceeds eight MiB; upload refused'
          print('Artifact bytes:', total)
          PY
      - uses: actions/upload-artifact@v7
        if: always() && steps.cap.outcome == 'success'
        with:
          name: pip-direct-depth-${{ github.sha }}-${{ github.run_attempt }}
          path: qa/yard-pip-webgl/followup-results/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
