name: Isolated saved Yard pickup qualification
on:
  push:
    branches: ['qa/yard-item-pickup-20261008']
permissions:
  contents: read
concurrency:
  group: yard-item-pickup-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ccgh_visit_test
          POSTGRES_DB: ccgh_visit_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55437:5432']
        options: >-
          --health-cmd "pg_isready -U ccgh_visit_test -d ccgh_visit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      CI: 'true'
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify default-off and no-publish boundary
        run: |
          mkdir -p test-results/item-pickup
          git fetch --no-tags --depth=1 origin ec815065f6adb7c36d81f97b41d47ad16e614b07
          node scripts/yard-item-pickup-preflight.mjs
          grep -F 'export const CANONICAL_SAVED_ITEM_ACTIONS_ENABLED=false;' game-logic/yard-v2/canonical-saved-item-actions.mjs
          git rev-parse HEAD > test-results/item-pickup/source-commit.txt
      - name: Install existing locked dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Closed gate and source-layout controls
        run: |
          set -o pipefail
          node --test tests/yard-saved-item-gate.test.mjs tests/yard-saved-zero-row-restore.test.mjs | tee test-results/item-pickup/source.log
      - name: Existing saved loop and receipt-backed cold replay
        run: |
          set -o pipefail
          node --import ./tests/fixtures/register-runtime-test.mjs --test --test-concurrency=1 tests/yard-saved-loop.test.mjs tests/yard-saved-zero-row-reconciliation.test.mjs | tee test-results/item-pickup/regressions.log
      - name: Actual command, duration boundaries and independent warm caches
        run: |
          set -o pipefail
          node --import ./tests/fixtures/register-runtime-test.mjs --import ./tests/fixtures/register-item-action-test.mjs --test --test-concurrency=1 tests/yard-saved-pickup-action.test.mjs tests/yard-saved-pickup-replica.test.mjs | tee test-results/item-pickup/commands.log
      - name: Winning HTTP projection and neighboring route regressions
        run: |
          set -o pipefail
          node --import ./tests/fixtures/register-runtime-test.mjs --import ./tests/fixtures/register-item-action-test.mjs --test tests/yard-saved-pickup-http.test.mjs | tee test-results/item-pickup/http.log
          node --test --test-concurrency=1 tests/garden-r2-routes.test.mjs tests/garden-accounting-routes.test.js | tee test-results/item-pickup/neighbor-routes.log
      - name: Actual two-process PostgreSQL CAS and cold restart
        env:
          DATABASE_URL: postgres://ccgh_visit_test@127.0.0.1:55437/ccgh_visit_test
          YARD_SAVED_VISIT_PG: '1'
        run: |
          set -o pipefail
          node --import ./tests/fixtures/register-runtime-test.mjs --import ./tests/fixtures/register-item-action-test.mjs --test tests/yard-saved-pickup-postgres.test.mjs | tee test-results/item-pickup/postgres.log
      - name: Install official Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real API, ordinary renderer, duplicate, reload and PostgreSQL readback
        env:
          DATABASE_URL: postgres://ccgh_visit_test@127.0.0.1:55437/ccgh_visit_test
          YARD_SAVED_VISIT_PG: '1'
          DEV_AUTH_ENABLED: 'true'
          VITE_YARD_PAINTED_FOOD_TRIAL: 'true'
        run: pnpm exec playwright test --config playwright.yard-saved-pickup.config.mjs
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yard-item-pickup-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
