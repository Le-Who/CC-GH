name: Isolated saved Yard pickup qualification
on:
  push:
    branches: ['qa/yard-item-pickup-20261008']
permissions:
  contents: read
concurrency:
  group: yard-item-pickup-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      CI: 'true'
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify default-off and no-publish boundary
        run: |
          mkdir -p test-results/item-pickup
          git fetch --no-tags --depth=1 origin ec815065f6adb7c36d81f97b41d47ad16e614b07
          node scripts/yard-item-pickup-preflight.mjs
          git rev-parse HEAD > test-results/item-pickup/source-commit.txt
      - name: Install existing locked dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Exact fixture JSON bundle preflight
        run: |
          set -o pipefail
          node --test tests/sw-fixture-json-loader.test.mjs | tee test-results/item-pickup/fixture-json.log
      - name: Build the exact integrated client
        env:
          NODE_ENV: production
          VITE_YARD_PIP_PREVIEW: 'true'
          VITE_YARD_SAVED_VISITS: 'true'
          VITE_YARD_PAINTED_FOOD_TRIAL: 'true'
        run: pnpm run build
      - name: Install official Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Courtyard pending visuals, Garden heartbeat and separate navigation timings
        run: pnpm exec playwright test --config playwright.game-feedback.config.mjs game-navigation-latency.spec.js yard-placement-feedback.spec.js
      - name: Preserve success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yard-item-pickup-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
