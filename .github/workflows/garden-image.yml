name: Garden terrarium on current live development image
on:
  push:
    branches: ['qa/garden-image-20261104-r2']
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: garden-image-20261104-r2
  cancel-in-progress: false
jobs:
  acceptance:
    name: Accept normal development image
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
      YARD_DEVELOPMENT_IMAGE_ACCEPTANCE: '1'
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      NODE_OPTIONS: ''
      DEV_AUTH_ENABLED: ''
      TELEGRAM_BOT_TOKEN: ''
      DATABASE_URL: ''
      REDIS_URL: ''
      YARD_PRODUCTION_ACCEPTANCE: ''
      YARD_CANDIDATE_CI: ''
      YARD_CANONICAL_API_TEST: ''
      YARD_PLAYER_API_TEST: ''
      YARD_PLAYER_WIRING_TEST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify reviewed source before dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin d09e7296af6e9499a0cd19322c6fda73dfcabef7
          git fetch --no-tags --depth=1 origin 638a4ad2adc3242e84271c72860421d1eeca3ce3
          git fetch --no-tags --depth=1 origin 80c4a8f4e14ec30ff3ec8be9ff7b36f5387cfbca
          node qa/garden-release/image-acceptance.mjs preflight
      - name: Install locked test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Source and release guard checks
        run: |
          set -o pipefail
          timeout 20s node --test-skip-pattern='^(shell (?!has no)|disappearing neighbor |Compose timeout |a later invocation |signal immediately after)' --import ./tests/yard-pip-register-vendor.mjs --test --test-reporter=tap --test-concurrency=1 tests/yard-development-capabilities.test.mjs tests/yard-internal-entry.test.mjs tests/yard-occupied-decor-labels.test.mjs tests/yard-canonical-food-host-scene.test.mjs tests/yard-renderer-chunk.test.mjs tests/yard-development-release.test.mjs tests/yard-development-acceptance.test.mjs tests/yard-development-receipt.test.mjs | tee test-results/yard-development/source.tap
          timeout 20s node --test --test-reporter=tap tests/garden-heartbeat-priority.test.mjs tests/garden-command-arbiter.test.mjs tests/garden-command-journal.test.mjs tests/yard-live-placement-feedback.test.mjs tests/sw-fixture-json-loader.test.mjs | tee test-results/yard-development/interaction-source.tap
          timeout 60s node --test --test-reporter=tap --test-name-pattern='^(shell success changes only app image/build identity and preserves original compose/env|shell during-switch performs actual healthy predecessor rollback|shell stale-public performs actual healthy predecessor rollback|a later invocation refuses unresolved daemon work despite a stale healthy predecessor|signal immediately after clearing a verified candidate marker cannot start an unmarked rollback)$' qa/garden-release/controller/tests/yard-development-release.test.mjs | tee test-results/yard-development/release-smoke.tap
          timeout 420s node --test --test-reporter=tap --test-concurrency=1 qa/garden-release/controller/tests/yard-development-release.test.mjs | tee test-results/yard-development/activation-controller.log
          timeout 20s node --test qa/garden-release/tests/binding.test.mjs
          timeout 30s python3 qa/garden-release/controller/tests/probe-compose-repeat-release.py > test-results/yard-development/activation-controller-compose.json
          timeout 30s go run qa/garden-release/controller/inspect-format.go > test-results/yard-development/activation-controller-formatter.log
      - name: Catalogue access and account regression checks
        run: |
          set -o pipefail
          timeout 30s node --test --test-reporter=tap --test-concurrency=1 tests/bentoku-bridge.test.js tests/hub-account-boundaries.test.mjs tests/realtime-account-boundaries.test.mjs tests/home-navigation.test.js tests/gameStore.test.js tests/api-network-cache.test.mjs tests/private-api-cache-lifecycle.test.mjs | tee test-results/yard-development/catalogue-access.tap
      - name: Garden source, contracts and reviewed source geometry
        run: |
          set -o pipefail
          timeout 30s node --test --test-reporter=tap tests/dialog-focus.test.js tests/garden-interaction.test.js tests/garden-living-plant-surface.test.mjs tests/garden-release-integration.test.js tests/garden-r2-store.test.mjs | tee test-results/yard-development/garden-source.tap
          timeout 30s node --test --test-reporter=tap tests/i18n.test.js tests/garden-r2-client.test.mjs tests/garden-r2.test.mjs tests/hud-layout.test.js | tee test-results/yard-development/garden-contracts.tap
          timeout 15s node --test --test-reporter=tap --test-name-pattern='Garden living|Garden.*panels' tests/ui-screen-surfaces.test.js | tee test-results/yard-development/garden-surfaces.tap
          timeout 30s node scripts/measure-garden-pot-anchors.mjs --check | tee test-results/yard-development/garden-geometry.log
      - name: Lossless enlarged evidence envelope
        run: timeout 30s node --test qa/garden-release/tests/evidence-cap.test.mjs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact normal image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BUILD_ID=${{ github.sha }}
            VITE_YARD_PIP_PREVIEW=true
          tags: ghcr.io/le-who/cc-gh:development-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull immutable registry outputs
        env:
          PUBLISHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const m=JSON.parse(fs.readFileSync('qa/garden-release/manifest.json'));
          assert.match(process.env.PUBLISHED_DIGEST,/^sha256:[a-f0-9]{64}$/);
          fs.mkdirSync('test-results/yard-development-work',{recursive:true});
          fs.writeFileSync('test-results/yard-development-work/published-image.json',JSON.stringify({commit:process.env.GITHUB_SHA,digest:process.env.PUBLISHED_DIGEST,origin:'docker/build-push-action actual registry output'}));
          for(const image of ['ghcr.io/le-who/cc-gh@'+process.env.PUBLISHED_DIGEST,'ghcr.io/le-who/cc-gh@'+m.predecessor.imageDigest,'postgres:15','redis:7-alpine'])execFileSync('docker',['pull',image],{stdio:'inherit',timeout:60000});
          JS
      - name: Seven bounded normal-image cases including Garden
        env:
          GH_TOKEN: ${{ github.token }}
        run: node qa/garden-release/image-acceptance.mjs run
      - name: Preserve every original within fixed cap
        if: always()
        run: node qa/garden-release/image-acceptance.mjs package
      - name: Upload original evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: garden-development-image-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/yard-development-upload/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
