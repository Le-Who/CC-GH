              container_hash="$(printf '%s' "$container_rows" | hash_bytes)"
              failure_code=protected_service_list
              services="$(timeout --foreground --kill-after=3s 20s systemctl list-units --type=service --all --no-legend --no-pager --plain | awk 'NF{print $1}' | sort)"
              service_count=0; service_active_count=0; service_failed_count=0; service_rows=''
              while IFS= read -r service; do
                [ -n "$service" ] || continue
                failure_code=protected_service_identity
                [[ "$service" = *.service && "$service" != -* && "$service" != *[[:space:]]* && "${#service}" -le 256 ]]
