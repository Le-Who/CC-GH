                service_value="$(timeout --foreground --kill-after=3s 5s systemctl show "$service" --property=Id,LoadState,ActiveState,SubState,MainPID,ExecMainStartTimestampMonotonic)"
                service_rows+="$service_value"$'\n'
                if [[ $'\n'"$service_value"$'\n' == *$'\n'"ActiveState=active"$'\n'* ]]; then service_active_count=$((service_active_count+1)); fi
                if [[ $'\n'"$service_value"$'\n' == *$'\n'"ActiveState=failed"$'\n'* ]]; then service_failed_count=$((service_failed_count+1)); fi
              done <<< "$services"
              failure_code=protected_service_hash
              service_hash="$(printf '%s' "$service_rows" | hash_bytes)"
