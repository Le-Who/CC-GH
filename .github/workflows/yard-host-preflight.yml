              failure_code=protected_caddy_hash
              caddy_hash="$(printf '%s' "$caddy" | hash_bytes)"
              caddy_active=false
              if [[ $'\n'"$caddy"$'\n' == *$'\n'"LoadState=loaded"$'\n'* && $'\n'"$caddy"$'\n' == *$'\n'"ActiveState=active"$'\n'* ]]; then caddy_active=true; fi
