              "$host_gates_passed" "$candidate_receipt_bound" "$candidate_identity_known" "$candidate_receipt_sha256" "$candidate_commit" "$candidate_digest" "$predecessor_commit" "$predecessor_digest" "$controller_source_matched" "$config_hash" "$actual_environment" "$actual_environment_safe" "$proposed_environment_proven" "$candidate_present" "$candidate_bound" "$candidate_id_sha256" "$candidate_environment" \
              "$local_health" "$public_health" "$local_config" "$public_config" "$public_html" "$protected_stable" "$container_count" "$container_running" "$container_unhealthy" "$service_count" "$service_active_count" "$service_failed_count" \
