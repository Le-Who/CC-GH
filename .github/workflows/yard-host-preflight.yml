              backup_available_kib="$(df -Pk backups | awk 'NR==2{print $4}')"
              [[ "$backup_available_kib" =~ ^[0-9]+$ ]]
            fi
            stage=5; failure_code=final_identity_recheck
            [ "$(run_docker inspect --format '{{.Image}}' ccgh-app)" = "$predecessor_image" ]
            [ "$(run_docker inspect --format '{{.Id}}' ccgh-app)" = "$app_id" ]
            [ "$(run_docker inspect --format "$boundary_format" ccgh-app | hash_bytes)" = "$app_boundary_hash" ]
            for file in .env docker-compose.yml .release.lock; do safe_file "$file"; done
            [ "$(stat -Lc '%d:%i:%s:%y:%z' -- .env)" = "$env_identity" ]
            [ "$(sha256sum docker-compose.yml | awk '{print $1}')" = "$compose_sha256" ]
            safe_file .release.lock
            [ "$(stat -Lc '%d:%i:%h:%F' -- .release.lock)" = "$lock_identity" ]
            test ! -e .yard-development-inflight; test ! -L .yard-development-inflight
            actual_environment_safe=true
            case "$actual_environment" in *false*) actual_environment_safe=false;; esac
            proposed_environment_proven=false
            if [ "$candidate_bound" = true ] && [ "$actual_environment_safe" = true ]; then case "$candidate_environment" in *false*) ;; *) proposed_environment_proven=true;; esac; fi
            host_gates_passed=true
            case "$local_health$public_health$local_config$public_config$public_html$actual_environment$proposed_environment_proven$protected_stable$caddy_active$controller_source_matched$backup_directory_safe" in *false*) host_gates_passed=false;; esac
            if [ "$container_unhealthy" -ne 0 ] || [ "$service_failed_count" -ne 0 ]; then host_gates_passed=false; fi
