            before_container_hash="$container_hash"; before_service_hash="$service_hash"; before_caddy_hash="$caddy_hash"; before_boot_hash="$boot_hash"
            before_count="$container_count"; before_services="$service_count"
            snapshot_pass=$((snapshot_pass+1))
            snapshot
            failure_code=protected_snapshot_compare
            protected_stable=true
            if [ "$container_hash" != "$before_container_hash" ] || [ "$service_hash" != "$before_service_hash" ] || [ "$caddy_hash" != "$before_caddy_hash" ] || [ "$boot_hash" != "$before_boot_hash" ] || [ "$container_count" != "$before_count" ] || [ "$service_count" != "$before_services" ]; then protected_stable=false; fi
