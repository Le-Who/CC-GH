name: Game Hub CI

on:
  workflow_call:
  pull_request:
    branches: [codex/telegram-pixi-vps-migration]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ccgh_merge_ci
          POSTGRES_PASSWORD: ccgh_merge_ci
          POSTGRES_DB: ccgh_merge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccgh_merge_ci -d ccgh_merge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate HUD layout contracts
        run: node scripts/hud-layout-validate.mjs

      - name: Build Telegram Mini App client
        run: pnpm run build

      - name: Run platform cleanup guard
        run: pnpm run test:cleanup

      - name: Run tests
        run: pnpm test

      - name: Validate casual motion and input lifecycle
        run: node --test --test-concurrency=1 tests/match3-motion.test.js tests/bubbo-effects.test.js tests/bubbo-field-motion.test.js tests/blox-casual-motion.test.cjs tests/casual-motion-feedback.test.mjs

      - name: Validate inactive Yard candidate
        env:
          NODE_ENV: test
          YARD_CANDIDATE_CI: '1'
        run: |
          node preview/yard-persistent-candidate/run-checks.mjs
          node preview/yard-persistent-candidate/compile-check.mjs

      - name: Merge V3 real PostgreSQL15 persistence and OCC
        env:
          MERGE_LAB_PG_TEST: '1'
          CI: 'true'
          NODE_ENV: test
          DATABASE_URL: postgres://ccgh_merge_ci:ccgh_merge_ci@127.0.0.1:5432/ccgh_merge_ci
          REDIS_URL: ''
        run: node --test --test-concurrency=1 tests/merge-lab-postgres.test.mjs

      - name: Garden atomic accounting PostgreSQL15 persistence and OCC
        env:
          GARDEN_ACCOUNTING_PG_TEST: '1'
          CI: 'true'
          NODE_ENV: test
          DATABASE_URL: postgres://ccgh_merge_ci:ccgh_merge_ci@127.0.0.1:5432/ccgh_merge_ci
          REDIS_URL: ''
        run: node --test --test-concurrency=1 tests/garden-accounting-postgres.test.mjs

      - name: Garden R2 PostgreSQL15 persistence and cross-process OCC
        env:
          GARDEN_R2_PG_TEST: '1'
          CI: 'true'
          NODE_ENV: test
          DATABASE_URL: postgres://ccgh_merge_ci:ccgh_merge_ci@127.0.0.1:5432/ccgh_merge_ci
          REDIS_URL: ''
          NODE_OPTIONS: ''
        run: node --test --test-concurrency=1 tests/garden-r2-postgres.test.mjs

      - name: Inactive Yard v2 PostgreSQL15 persistence and cross-process OCC
        env:
          YARD_V2_PG_TEST: '1'
          YARD_V2_PG_TARGET: candidate
          YARD_CANDIDATE_CI: '1'
          CI: 'true'
          NODE_ENV: test
          DATABASE_URL: postgres://ccgh_merge_ci:ccgh_merge_ci@127.0.0.1:5432/ccgh_merge_ci
          REDIS_URL: ''
          NODE_OPTIONS: ''
        run: node --test --test-concurrency=1 tests/yard-v2-postgres.test.mjs

      - name: Check Yard v2 persistence fixture safety
        run: node --test --test-concurrency=1 tests/yard-v2-pg-fixture.test.mjs tests/yard-v2-pg-guard.test.mjs

      - name: Install Chromium for browser regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run integrated browser regression tests
        run: pnpm exec playwright test --project=chromium --workers=1

      - name: Preserve compact browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-browser-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-results.json
            test-results/**/error-context.md
            test-results/**/*-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-browser-screenshots-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-browser-report-${{ github.sha }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve browser traces separately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-browser-traces-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve verified client build
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-client-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 14

  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run touch-specific and gesture regression tests
        run: pnpm exec playwright test tests/e2e/gestures.spec.js --project=mobile-chrome --workers=1
      - name: Preserve touch diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-touch-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-results.json
            test-results/**/error-context.md
            test-results/**/*-diagnostics.json
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve touch traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-touch-traces-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 14

  mochi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check Mochi source presenter
        run: node --test tests/yard-mochi-presentation.test.mjs
      - name: Check canonical actors and mixed-prop boundaries
        run: node --test tests/yard-mixed-obstacles.test.mjs tests/yard-pip-canonical.test.mjs tests/yard-pip-scene-lifecycle.test.mjs tests/yard-pebble-canonical.test.mjs tests/yard-pebble-scene-lifecycle.test.mjs tests/yard-mochi-canonical.test.mjs tests/yard-mochi-scene-lifecycle.test.mjs
      - name: Validate inactive Mochi media
        run: pnpm exec playwright test -c playwright.mochi.config.js --project=chromium --workers=1
      - name: Validate canonical Yard scene
        run: pnpm exec playwright test -c playwright.yard-canonical.config.js --project=chromium --workers=1
      - name: Check Pip source binding
        run: node --test tests/yard-pip-source.test.mjs
      - name: Validate inactive Pip visit
        run: pnpm exec playwright test -c playwright.pip.config.js --project=chromium --workers=1
      - name: Validate Pebble shared-scene candidate
        run: pnpm exec playwright test -c playwright.yard-pebble.config.js --project=chromium --workers=1
      - name: Validate canonical Pip scene
        run: pnpm exec playwright test -c playwright.pip-canonical.config.js --project=chromium --workers=1
      - name: Collect bounded Pebble diagnostics
        if: always()
        run: if [ -f test-results-yard-pebble/results.json ]; then node scripts/collect-yard-pebble-diagnostics.mjs; fi
      - name: Preserve Pebble compact review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-compact-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/compact-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble viewport frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-frames-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/viewport-frames/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble compact shard 02
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-compact-02-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/compact-diagnostics-02/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble compact shard 03
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-compact-03-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/compact-diagnostics-03/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble compact shard 04
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-compact-04-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/compact-diagnostics-04/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble frames shard 02
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-frames-02-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/viewport-frames-02/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble frames shard 03
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-frames-03-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/viewport-frames-03/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pebble frames shard 04
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pebble-frames-04-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-pebble/viewport-frames-04/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve canonical Pip compact review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pip-canonical-compact-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-pip-canonical/compact/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Pip visit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pip-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results-pip/
            playwright-report-pip/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve compact Pip review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-pip-compact-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-pip/compact/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve canonical Yard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-yard-canonical-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-yard-canonical/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Mochi diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-mochi-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results-mochi/results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve Mochi evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-hub-mochi-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results-mochi/artifacts/
            playwright-report-mochi/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    needs: [test, touch, mochi]
    steps:
      - uses: actions/checkout@v6

      - name: Verify Docker build
        run: docker build -t game-hub-ci .
