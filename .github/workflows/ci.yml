  docker:
    runs-on: ubuntu-latest
    needs: [test, browser, touch, mochi, yard-eight-player, yard-player]
    steps:
      - uses: actions/checkout@v6

      - name: Verify Docker build
        run: docker build -t game-hub-ci .

      - name: Verify final container Yard HTTP delivery
        run: docker run --rm --network none --entrypoint node game-hub-ci scripts/yard-public-media-http.mjs

  yard-closed-receipt:
    name: Verify reused CLOSED acceptance
    needs: [yard-release-mode]
    if: needs.yard-release-mode.outputs.reuse_closed == 'true' && needs.yard-release-mode.outputs.mode != 'MAINTENANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.yard-release-mode.outputs.active_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Verify unchanged ACTIVE promotion boundary
        run: node scripts/yard-ci-dispatch.mjs --verify-active
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.yard-release-mode.outputs.closed_ref }}
          path: closed-proof
          persist-credentials: false
      - name: Verify full CLOSED contract on exact A
        working-directory: closed-proof
        env:
          CLOSED_SOURCE_COMMIT: ${{ needs.yard-release-mode.outputs.closed_ref }}
        run: node scripts/yard-ci-dispatch.mjs --assert-closed-ref "$CLOSED_SOURCE_COMMIT"
      - name: Verify authoritative GitHub run and every required CLOSED job
        working-directory: closed-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/yard-closed-ci-receipt.mjs --verify ../game-logic/yard-v2/active-release-contract.json
      - uses: actions/upload-artifact@v7
        with:
          name: reused-closed-${{ needs.yard-release-mode.outputs.closed_ref }}-for-${{ needs.yard-release-mode.outputs.active_ref }}-${{ github.run_attempt }}
          path: closed-proof/artifacts/yard-closed-ci-receipt.json
          if-no-files-found: error
          retention-days: 14

  yard-active:
    name: ACTIVE ordinary imports
    needs: [yard-release-mode]
    if: needs.yard-release-mode.outputs.mode == 'ACTIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.yard-release-mode.outputs.active_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Verify exact ACTIVE tree before installing or building
        run: node scripts/yard-ci-dispatch.mjs --verify-active
      - name: Install frozen dependencies
        run: |
          corepack enable && corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
      - name: Build ordinary ACTIVE client
        env:
          VITE_BUILD_ID: ${{ needs.yard-release-mode.outputs.active_ref }}
        run: pnpm run build
      - name: Check ordinary ACTIVE behavior and real adapter metadata
        run: node scripts/yard-active-runtime-checks.mjs
      - name: Check ACTIVE loading graph and exact delivered bytes
        env:
          NODE_ENV: test
        run: |
          node --test tests/yard-renderer-chunk.test.mjs tests/yard-contract-data.test.mjs tests/yard-lazy-built.test.mjs tests/yard-public-media.test.mjs tests/yard-public-media-built.test.mjs
          pnpm run perf:guard:build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yard-active-build-${{ needs.yard-release-mode.outputs.active_ref }}-${{ github.run_attempt }}
          path: |
            artifacts/perf/
            dist/game-loading-graph.json
          if-no-files-found: error
          retention-days: 14

  yard-active-production:
    name: ACTIVE published-image preflight
    needs: [yard-release-mode, yard-active]
    if: needs.yard-release-mode.outputs.mode == 'ACTIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.yard-release-mode.outputs.active_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Validate exact ACTIVE tree and published-image acceptance safety
        run: |
          node scripts/yard-ci-dispatch.mjs --verify-active
          node --test tests/yard-production-contract.test.mjs
      - name: Report pending exact published-image runtime acceptance
        run: |
          echo "ACTIVE preflight passed for $GITHUB_SHA. Runtime migration, persistence and rollback acceptance is pending the exact published image digest; deploy remains gated on all nine cases." >> "$GITHUB_STEP_SUMMARY"

  yard-maintenance-preflight:
    name: ACTIVE maintenance preflight
    needs: [yard-release-mode]
    if: needs.yard-release-mode.outputs.mode == 'MAINTENANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      YARD_MAINTENANCE_ACCEPTANCE: '1'
      YARD_MAINTENANCE_REQUEST_JSON: ${{ inputs.maintenance_request_json }}
      YARD_MAINTENANCE_REQUEST_SHA256: ${{ inputs.maintenance_request_sha256 }}
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.yard-release-mode.outputs.active_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Verify exact maintenance source and authoritative predecessor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/yard-maintenance-cli.mjs --plan "$PWD" "$RUNNER_TEMP/maintenance-preflight"
      - name: Test maintenance boundary and receipt negatives
        run: node --test tests/yard-active-maintenance.test.mjs tests/yard-maintenance-integration.test.mjs
      - name: Install frozen dependencies
        run: |
          corepack enable && corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
      - name: Run ordinary build and affected-game checks
        run: node scripts/yard-maintenance-cli.mjs --checks "$PWD" "$RUNNER_TEMP/maintenance-preflight"
      - name: Report pending published maintenance image acceptance
        run: echo "Maintenance source and ordinary checks passed. Real published P-C-P image/API/PG/SW acceptance is still mandatory in the explicitly approved maintenance release workflow before a live switch." >> "$GITHUB_STEP_SUMMARY"

  release-ready:
    name: Exact source release acceptance
    needs: [yard-release-mode, test, yard-player, yard-eight-player, browser-plan, browser, touch, mochi, docker, yard-closed-receipt, yard-active, yard-active-production, yard-maintenance-preflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete mode-specific result set
        env:
          RELEASE_MODE: ${{ needs.yard-release-mode.outputs.mode }}
          REUSE_CLOSED: ${{ needs.yard-release-mode.outputs.reuse_closed }}
          RELEASE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const needs=JSON.parse(process.env.RELEASE_RESULTS),mode=process.env.RELEASE_MODE;
          assert.ok(['CLOSED','ACTIVE','MAINTENANCE'].includes(mode));
          assert.equal(needs['yard-release-mode'].result,'success');
          assert.ok(['true','false'].includes(process.env.REUSE_CLOSED));
          const reuse=process.env.REUSE_CLOSED==='true';assert.ok(!reuse||mode==='ACTIVE'||mode==='MAINTENANCE');
          if(mode==='MAINTENANCE')assert.equal(reuse,true);
          for(const job of ['test','yard-player','yard-eight-player','browser-plan','browser','touch','mochi','docker'])assert.equal(needs[job].result,reuse?'skipped':'success',job);
          assert.equal(needs['yard-closed-receipt'].result,reuse&&mode!=='MAINTENANCE'?'success':'skipped');
          for(const job of ['yard-active','yard-active-production'])assert.equal(needs[job].result,mode==='ACTIVE'?'success':'skipped',job);
          assert.equal(needs['yard-maintenance-preflight'].result,mode==='MAINTENANCE'?'success':'skipped');
          JS
