name: Game Hub CI

on:
  push:
    branches: [codex/telegram-pixi-vps-migration]
  pull_request:
    branches: [codex/telegram-pixi-vps-migration]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Telegram Mini App client
        run: pnpm run build

      - name: Run platform cleanup guard
        run: pnpm run test:cleanup

      - name: Run tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Verify Docker build
        run: docker build -t game-hub-ci .
