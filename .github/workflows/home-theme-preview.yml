name: Home theme and honest preview QA
on:
  push:
    branches: ['qa/home-theme-preview-20261007']
permissions:
  contents: read
concurrency:
  group: home-theme-preview-20261007
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      CI: 'true'
      DATABASE_URL: ''
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Native Home theme regression and actual gameplay captures
        run: |
          set -o pipefail
          mkdir -p test-results/home-theme
          DEBUG=pw:webserver pnpm exec playwright test --config playwright.home-theme.config.mjs 2>&1 | tee test-results/home-theme/browser-build.log
      - name: Compress one real gameplay loop for comparison
        if: ${{ !cancelled() }}
        run: |
          if [ -f test-results/home-theme/bubbo-native-shot.webm ]; then
            ffmpeg -version | head -1 > test-results/home-theme/ffmpeg-version.txt
            ffmpeg -y -sseof -3 -i test-results/home-theme/bubbo-native-shot.webm -an -vf "scale=400:300,fps=12" -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p -crf 30 -movflags +faststart test-results/home-theme/bubbo-shot-preview.mp4
            ffprobe -v quiet -show_format -show_streams -of json test-results/home-theme/bubbo-shot-preview.mp4 > test-results/home-theme/loop-media.json
          fi
      - name: Preserve failures and source identity
        if: always()
        run: mkdir -p test-results/home-theme && git rev-parse HEAD > test-results/home-theme/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-theme-${{ github.sha }}
          path: test-results/home-theme/
          retention-days: 7
          if-no-files-found: error
