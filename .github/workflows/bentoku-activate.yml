      - name: Verify and test pinned stdin-only SSH boundary
        run: |
          set +x
          set -euo pipefail
          boundary="$RUNNER_TEMP/yard-stdin-transport"
          test "$(sha256sum -- "$boundary/ssh-stdin.py" | cut -d ' ' -f 1)" = e0e8c71aaeec4ab01cf1a3485239bf9030fbaf99253b8b10b22a95159397c2c2
          test "$(sha256sum -- "$boundary/test-ssh-stdin.py" | cut -d ' ' -f 1)" = 30be37ddef204b69165a40b7b7c0f9f52eb10a2cab4664867b451727c88ebfdf
          test "$(sha256sum -- "$boundary/transport.sh" | cut -d ' ' -f 1)" = 3096ea528f64ff54c1d51f691ef72923d2136d659acab67396351143b2d2d89b
          python3 "$boundary/test-ssh-stdin.py"
      - name: Activate exact packet over pinned SSH with stdin-only token
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          YARD_GHCR_USER: ${{ github.actor }}
          YARD_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          python3 "$RUNNER_TEMP/yard-stdin-transport/ssh-stdin.py" "$RUNNER_TEMP/yard-stdin-transport/transport.sh"
