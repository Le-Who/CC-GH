name: Garden tap and layout qualification
on:
  push:
    branches: ['qa/garden-tap-layout-20261007']
permissions:
  contents: read
concurrency:
  group: garden-tap-layout-20261007
  cancel-in-progress: false
jobs:
  garden-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check resources and install locked dependencies
        run: |
          df -h . /tmp
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Garden state, interaction and living renderer regression tests
        run: |
          mkdir -p test-results/garden-tap-layout
          set -o pipefail
          node --test --test-concurrency=1 tests/garden-r2-store.test.mjs tests/garden-interaction.test.js tests/garden-r2-client.test.mjs tests/garden-r2-service.test.mjs tests/garden-living-plant-motion.test.mjs tests/garden-living-plant-surface.test.mjs tests/garden-living-plant-presentation-contract.test.mjs | tee test-results/garden-tap-layout/source.tap
      - name: Full Garden native browser matrix
        run: pnpm exec playwright test --config qa/garden-tap-layout/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-tap-layout-evidence
          path: test-results/garden-tap-layout
          retention-days: 14
