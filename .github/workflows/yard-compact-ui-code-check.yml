name: Compact Yard UI code check
on:
  push:
    branches: ['qa/yard-compact-ui-code-20261005']
permissions:
  contents: read
jobs:
  code-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable ordinary repository package manager
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - name: Install ordinary repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Check syntax, preview guards, and complete UI reserve
        run: node qa/yard-compact-ui-code-check.mjs
