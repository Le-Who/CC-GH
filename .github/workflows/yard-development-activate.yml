      - name: Verify and test pinned stdin-only SSH boundary
        run: |
          set +x
          set -euo pipefail
          boundary="$RUNNER_TEMP/yard-stdin-transport"
          test "$(sha256sum -- "$boundary/ssh-stdin.py" | cut -d ' ' -f 1)" = 0d6f00e075eea250616758839fcfb9711d320db5eadf1e5131f5e956ee306d8a
          test "$(sha256sum -- "$boundary/test-ssh-stdin.py" | cut -d ' ' -f 1)" = 1a4ebada5a397d9786a13dd1b8d2950b23baf18a1f3a801c1e97c57ac72a4b73
          test "$(sha256sum -- "$boundary/transport.sh" | cut -d ' ' -f 1)" = 3bd0e3e165c2d95bb940b890b98343ffc2b2b0df843b649be6869dd15d72b4c2
          python3 "$boundary/test-ssh-stdin.py"
      - name: Activate exact packet over pinned SSH with stdin-only token
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          YARD_GHCR_USER: ${{ github.actor }}
          YARD_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          set -euo pipefail
          python3 "$RUNNER_TEMP/yard-stdin-transport/ssh-stdin.py" "$RUNNER_TEMP/yard-stdin-transport/transport.sh"
