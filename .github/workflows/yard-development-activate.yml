# Inactive local deliverable. Publication is a separate authorized action.
name: CC-GH exact Yard development activation
on:
  push:
    branches: ['qa/yard-development-activate-20261007']
permissions:
  contents: read
concurrency:
  group: cc-gh-production
  cancel-in-progress: false
jobs:
  activate-exact-game-image:
    if: github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check exact controller formatter before any SSH
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d "$RUNNER_TEMP/yard-controller-format.XXXXXX")"
          cat > "$probe_dir/check.go" <<'YARD_GO'
          // Mandatory runner-side Go standard-library regression; no network/packages.
          // Mirrors Docker CLI v27.5.1 inspector.go: typed lookup, then missingkey=error
          // JSON-map fallback. It does not claim a daemon integration test.
          package main
          
          import (
            "bytes"
            "encoding/json"
            "fmt"
            "strings"
            "text/template"
          )
          type Health struct { Status string }
          type State struct { StartedAt string; Status string; Health *Health `json:",omitempty"` }
          type Container struct { ID string `json:"Id"`; Image string; Name string; RestartCount int; State State }
          const oldFormat = "{\"id\":{{json .Id}},\"image\":{{json .Image}},\"name\":{{json .Name}},\"startedAt\":{{json .State.StartedAt}},\"restartCount\":{{json .RestartCount}},\"status\":{{json .State.Status}},\"health\":{{if .State.Health}}{{json .State.Health.Status}}{{else}}null{{end}}}"
          const fixedFormat = "{\"id\":{{json .Id}},\"image\":{{json .Image}},\"name\":{{json .Name}},\"startedAt\":{{json .State.StartedAt}},\"restartCount\":{{json .RestartCount}},\"status\":{{json .State.Status}},\"health\":{{if eq (json (index .State \"Health\")) \"null\"}}null{{else}}{{json .State.Health.Status}}{{end}}}"
          const databaseFormat = "{{- $user := false -}}{{- $database := false -}}{{- $seenUser := false -}}{{- $seenDatabase := false -}}{{- $ambiguous := false -}}{{- range .Config.Env -}}{{- $key := index (split . \"=\") 0 -}}{{- if eq $key \"POSTGRES_USER\" -}}{{- if $seenUser -}}{{- $ambiguous = true -}}{{- end -}}{{- $seenUser = true -}}{{- $user = eq . \"POSTGRES_USER=appuser\" -}}{{- end -}}{{- if eq $key \"POSTGRES_DB\" -}}{{- if $seenDatabase -}}{{- $ambiguous = true -}}{{- end -}}{{- $seenDatabase = true -}}{{- $database = eq . \"POSTGRES_DB=gamehub\" -}}{{- end -}}{{- end -}}{{and $user $database (not $ambiguous)}}"
          
          func render(format string, v any) (string,error) {
            funcs:=template.FuncMap{"json":func(v any)string{b,e:=json.Marshal(v);if e!=nil{panic(e)};return string(b)},"split":strings.Split}
            t,e:=template.New("inspect").Option("missingkey=error").Funcs(funcs).Parse(format);if e!=nil{panic(e)}
            var out bytes.Buffer;e=t.Execute(&out,v);return out.String(),e
          }
          func main() {
            typed:=Container{ID:strings.Repeat("a",64),Image:"sha256:"+strings.Repeat("b",64),Name:"/neighbor",State:State{StartedAt:"2026-10-07T00:00:00Z",Status:"running"}}
            if _,e:=render(oldFormat,typed);e==nil{panic("Typed Id/ID fallback regression was not reached")}
            raw:=func()map[string]any{b,e:=json.Marshal(typed);if e!=nil{panic(e)};var m map[string]any;if json.Unmarshal(b,&m)!=nil{panic("fixture")};return m}
            if _,e:=render(oldFormat,raw());e==nil{panic("Old absent Health regression was not reproduced")}
            cases:=[]struct{name string;change func(map[string]any);health any;invalid bool}{
              {"absent",func(m map[string]any){},nil,false},
              {"null",func(m map[string]any){m["State"].(map[string]any)["Health"]=nil},nil,false},
              {"healthy",func(m map[string]any){m["State"].(map[string]any)["Health"]=map[string]any{"Status":"healthy","Log":"SECRET_CANARY"}},"healthy",false},
              {"unhealthy",func(m map[string]any){m["State"].(map[string]any)["Health"]=map[string]any{"Status":"unhealthy"}},"unhealthy",false},
              {"malformed",func(m map[string]any){m["State"].(map[string]any)["Health"]=map[string]any{"Log":"SECRET_CANARY"}},nil,true},
              {"wrong shape",func(m map[string]any){m["State"].(map[string]any)["Health"]="SECRET_CANARY"},nil,true},
              {"missing Id",func(m map[string]any){delete(m,"Id")},nil,true},
              {"wrong ID",func(m map[string]any){m["ID"]=m["Id"];delete(m,"Id")},nil,true},
              {"missing Image",func(m map[string]any){delete(m,"Image")},nil,true},
              {"missing Name",func(m map[string]any){delete(m,"Name")},nil,true},
              {"missing RestartCount",func(m map[string]any){delete(m,"RestartCount")},nil,true},
              {"missing State",func(m map[string]any){delete(m,"State")},nil,true},
              {"missing StartedAt",func(m map[string]any){delete(m["State"].(map[string]any),"StartedAt")},nil,true},
              {"missing Status",func(m map[string]any){delete(m["State"].(map[string]any),"Status")},nil,true},
            }
            for _,c:=range cases {
              m:=raw();c.change(m);out,e:=render(fixedFormat,m)
              if (e!=nil)!=c.invalid{panic(c.name+": incorrect strict field result")}
              if strings.Contains(out,"SECRET_CANARY"){panic("Private field escaped formatter")}
              if !c.invalid {var r map[string]any;if json.Unmarshal([]byte(out),&r)!=nil||len(r)!=7||r["health"]!=c.health{panic(c.name+": output mismatch")}}
            }
            dbCases:=[]struct{env []string;want string}{
              {[]string{"POSTGRES_USER=appuser","POSTGRES_DB=gamehub","POSTGRES_PASSWORD=SECRET_CANARY"},"true"},
              {[]string{"POSTGRES_USER=other","POSTGRES_DB=gamehub"},"false"},
              {[]string{"POSTGRES_USER=appuser","POSTGRES_DB=other"},"false"},
              {[]string{"POSTGRES_USER=appuser","POSTGRES_USER=appuser","POSTGRES_DB=gamehub"},"false"},
              {[]string{"POSTGRES_USER=appuser","POSTGRES_DB=gamehub","POSTGRES_DB=gamehub"},"false"},
              {[]string{"POSTGRES_USER=appuser"},"false"},
              {[]string{"POSTGRES_DB=gamehub"},"false"},
            }
            for _,c:=range dbCases {out,e:=render(databaseFormat,map[string]any{"Config":map[string]any{"Env":c.env}});if e!=nil||out!=c.want{panic("Database boolean gate mismatch")}}
            fmt.Println("Typed fallback + old formatter regression, 14 strict Health cases and 7 database boolean cases passed; no raw secrets emitted.")
          }
          YARD_GO
          go run "$probe_dir/check.go"
      - name: Activate reviewed game-only packet through existing SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 9m
          script: |
            bash -s -- <<'CCGH_EXACT_ACTIVATION'
            #!/usr/bin/env bash
            set +x
            set -euo pipefail
            umask 077
            # The publication contains literal approved non-secret bytes only.
            readonly release_root=/opt/game-hub
            readonly stage_dir=/opt/game-hub/releases/yard-development-a92209dace49d8b2b2b70be495913bb03f34ca82259b627c195a551787e6ba9f
            readonly packet=/opt/game-hub/releases/yard-development-a92209dace49d8b2b2b70be495913bb03f34ca82259b627c195a551787e6ba9f/packet
            readonly approved=a92209dace49d8b2b2b70be495913bb03f34ca82259b627c195a551787e6ba9f
            exec 2>/dev/null
            stage=initial_guards; worker_launched=false
            failed_before_launch() {
              status=$?
              if [ "$status" -ne 0 ] && [ "$worker_launched" = false ]; then
                printf '{"format":"cc-gh-yard-activation-transport/v1","workerLaunched":false,"failedStage":"%s","recordSha256":"%s"}\n' "$stage" "$approved"
              fi
            }
            trap failed_before_launch EXIT
            for tool in bash docker timeout flock stat sha256sum base64 mkdir chmod nohup setsid mv sleep cat cut df awk; do command -v "$tool" >/dev/null; done
            for directory in "$release_root" "$release_root/releases"; do
              test -d "$directory"; test ! -L "$directory"; [ "$(cd -- "$directory" && pwd -P)" = "$directory" ]
            done
            for file in .env docker-compose.yml .release.lock; do test -f "$release_root/$file"; test ! -L "$release_root/$file"; [ "$(stat -Lc '%h' -- "$release_root/$file")" = 1 ]; done
            [ "$(sha256sum -- "$release_root/docker-compose.yml" | cut -d ' ' -f 1)" = d5e6e1e6afef6733ce340ccc9b3eefb45630ac2dba14ac9810a9af1676293a4f ]
            test ! -e "$release_root/.yard-development-inflight"; test ! -L "$release_root/.yard-development-inflight"
            stage=runtime_pins
            # Narrow runtime pins, evaluated before any host staging, pull, backup, or switch.
            # No raw environment, connection string, row, or diagnostic is emitted.
            for option in DOCKER_HOST DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_CONFIG; do [ -z "${!option:-}" ]; done
            run_docker() { timeout --foreground --kill-after=5s 30s docker "$@"; }
            [ "$(run_docker context show)" = default ]
            [ "$(run_docker context inspect default --format '{{.Endpoints.docker.Host}}')" = unix:///var/run/docker.sock ]
            [ "$(run_docker inspect --format '{{.Image}}' ccgh-app)" = sha256:3feb1aa00e39358bf7befbece67215483390ee089e913f8088c3aae8f7ebc9ad ]
            [ "$(run_docker inspect --format '{{len .Mounts}}' ccgh-app)" = 0 ]
            [ "$(run_docker inspect --format '{{and (eq (len .HostConfig.PortBindings) 1) (eq (len (index .HostConfig.PortBindings "8080/tcp")) 1)}}{{range (index .HostConfig.PortBindings "8080/tcp")}}{{and (eq .HostIp "127.0.0.1") (eq .HostPort "18080")}}{{end}}' ccgh-app)" = truetrue ]
            database_environment_template='{{- $user := false -}}{{- $database := false -}}{{- $seenUser := false -}}{{- $seenDatabase := false -}}{{- $ambiguous := false -}}{{- range .Config.Env -}}{{- $key := index (split . "=") 0 -}}{{- if eq $key "POSTGRES_USER" -}}{{- if $seenUser -}}{{- $ambiguous = true -}}{{- end -}}{{- $seenUser = true -}}{{- $user = eq . "POSTGRES_USER=appuser" -}}{{- end -}}{{- if eq $key "POSTGRES_DB" -}}{{- if $seenDatabase -}}{{- $ambiguous = true -}}{{- end -}}{{- $seenDatabase = true -}}{{- $database = eq . "POSTGRES_DB=gamehub" -}}{{- end -}}{{- end -}}{{and $user $database (not $ambiguous)}}'
            [ "$(run_docker inspect --format "$database_environment_template" ccgh-postgres)" = true ]
            database_target_program='try { const u = new URL(process.env.DATABASE_URL); process.stdout.write(String(u.protocol === "postgresql:" && u.hostname === "postgres" && (u.port === "" || u.port === "5432") && u.username === "appuser" && u.pathname === "/gamehub" && u.search === "" && u.hash === "")); } catch { process.stdout.write("false"); }'
            [ "$(run_docker exec -e NODE_OPTIONS= -e NODE_PATH= -e LD_PRELOAD= -e LD_LIBRARY_PATH= ccgh-app /usr/local/bin/node --input-type=module -e "$database_target_program")" = true ]
            database_probe="$(run_docker exec -e PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=10000 -c lock_timeout=3000' ccgh-postgres psql -X -A -t -v ON_ERROR_STOP=1 -U appuser -d gamehub -c "SELECT current_user = 'appuser' AND current_database() = 'gamehub', pg_database_size(current_database());")"
            [[ "$database_probe" =~ ^t\|([0-9]{1,15})$ ]]
            database_bytes="${BASH_REMATCH[1]}"
            [[ "$database_bytes" =~ ^(0|[1-9][0-9]*)$ ]]
            test -d "$release_root/backups"; test ! -L "$release_root/backups"
            [ "$(cd -- "$release_root/backups" && pwd -P)" = "$release_root/backups" ]
            docker_root="$(run_docker info --format '{{.DockerRootDir}}')"
            [[ "$docker_root" =~ ^/[A-Za-z0-9_./-]+$ ]]; test -d "$docker_root"
            backup_available_kib="$(df -Pk -- "$release_root/backups" | awk 'NR==2{print $4}')"
            docker_available_kib="$(df -Pk -- "$docker_root" | awk 'NR==2{print $4}')"
            [[ "$backup_available_kib" =~ ^(0|[1-9][0-9]{0,14})$ && "$docker_available_kib" =~ ^(0|[1-9][0-9]{0,14})$ ]]
            backup_required_kib=$(((database_bytes + 1023) / 1024 * 2))
            protected_reserve_kib=4194304
            candidate_pull_allowance_kib=4194304
            if [ "$(stat -Lc '%d' -- "$release_root/backups")" = "$(stat -Lc '%d' -- "$docker_root")" ]; then
              [ "$backup_available_kib" -ge "$((backup_required_kib + protected_reserve_kib + candidate_pull_allowance_kib))" ]
            else
              [ "$backup_available_kib" -ge "$((backup_required_kib + protected_reserve_kib))" ]
              [ "$docker_available_kib" -ge "$((protected_reserve_kib + candidate_pull_allowance_kib))" ]
            fi
            printf '{"runtimePinsVerified":true,"databaseSizeBytes":%s,"backupAvailableKiB":%s,"dockerAvailableKiB":%s,"requiredBackupKiB":%s,"protectedReserveKiB":%s,"candidatePullAllowanceKiB":%s,"capacityPassed":true}\n' \
              "$database_bytes" "$backup_available_kib" "$docker_available_kib" "$backup_required_kib" "$protected_reserve_kib" "$candidate_pull_allowance_kib"
            
            test ! -e "$stage_dir"; test ! -L "$stage_dir"
            stage=exclusive_staging
            # Exclusive staging: even an incomplete previous attempt cannot be overwritten.
            mkdir -m 0700 -- "$stage_dir"
            mkdir -m 0700 -- "$packet" "$stage_dir/tools"
            (set -o noclobber; base64 --decode > "$stage_dir/packet/development-record.json" <<'YARD_BASE64'
            ewogICJmb3JtYXQiOiAiY2MtZ2gteWFyZC1kZXZlbG9wbWVudC1yZWxlYXNlL3YxIiwKICAicmVwb3NpdG9yeSI6ICJsZS13aG8vY2MtZ2giLAogICJtb2Rl
