name: Mika normal Yard finite cruise QA
on:
  push:
    branches: ['qa/mika-normal-yard-20261008']
permissions:
  contents: read
concurrency:
  group: mika-normal-yard-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      VITE_YARD_MIKA_QA: 'false'
      MIKA_QA_EXPECT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify immutable source and full inherited closure
        run: |
          mkdir -p test-results/mika-normal
          git fetch --no-tags --depth=1 origin 1a66a9df3d177d1b8308bab223ad6f647a76f98a
          node scripts/mika-normal-qa-preflight.mjs source > test-results/mika-normal/source-boundary.json
      - name: Install existing locked dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Source and neighboring owner regressions
        run: |
          set -o pipefail
          node --import ./tests/yard-pip-register-vendor.mjs --test --test-concurrency=1 tests/yard-mika-qa-*.test.mjs tests/yard-canonical-saved-scene.test.mjs tests/yard-pip-scene-lifecycle.test.mjs | tee test-results/mika-normal/source.log
      - name: Collect exact browser cases
        run: |
          MIKA_QA_PHASE=collection-off pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'off-build never requests' --list > test-results/mika-normal/collection-off.log
          MIKA_QA_EXPECT_ENABLED=true MIKA_QA_PHASE=collection-compact pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'four-second seeded cruise, real pixels' --list > test-results/mika-normal/collection-compact.log
          MIKA_QA_EXPECT_ENABLED=true MIKA_QA_PHASE=collection-matrix pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 portrait390 landscape844 --grep 'four-second seeded cruise|clean' --list > test-results/mika-normal/collection-matrix.log
          MIKA_QA_EXPECT_ENABLED=true MIKA_QA_PHASE=collection-interruptions pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait390 --grep 'editor entry|actual game navigation' --list > test-results/mika-normal/collection-interruptions.log
      - name: Build default-off app
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm run build | tee test-results/mika-normal/off-build.log
          node scripts/mika-normal-qa-preflight.mjs off > test-results/mika-normal/off-build-graph.json
      - name: Install official Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Default-off normal route admission
        run: MIKA_QA_PHASE=off pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'off-build never requests'
      - name: Build explicit Mika QA app
        id: enabled
        env:
          NODE_ENV: production
          VITE_YARD_MIKA_QA: 'true'
        run: |
          set -o pipefail
          pnpm run build | tee test-results/mika-normal/on-build.log
          node scripts/mika-normal-qa-preflight.mjs on > test-results/mika-normal/on-build-graph.json
      - name: Record QA build shipping-budget status
        continue-on-error: true
        run: node scripts/perf-build-guard.mjs --report test-results/mika-normal/build-budget.json
      - name: Compact actual-pixel diagnostic
        id: compact
        env:
          MIKA_QA_EXPECT_ENABLED: 'true'
        run: MIKA_QA_PHASE=compact pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'four-second seeded cruise, real pixels'
      - name: Three-viewport pixels and clean motion
        if: always() && steps.compact.outcome == 'success'
        env:
          MIKA_QA_EXPECT_ENABLED: 'true'
        run: MIKA_QA_PHASE=matrix pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 portrait390 landscape844 --grep 'four-second seeded cruise|clean'
      - name: Real editing and navigation interruption
        if: always() && steps.compact.outcome == 'success'
        env:
          MIKA_QA_EXPECT_ENABLED: 'true'
        run: MIKA_QA_PHASE=interruptions pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait390 --grep 'editor entry|actual game navigation'
      - name: Preserve all original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mika-normal-yard-${{ github.sha }}
          path: test-results/mika-normal/
          retention-days: 7
          if-no-files-found: error
