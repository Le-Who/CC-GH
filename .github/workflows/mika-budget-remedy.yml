name: Mika four-actor cold-ledger diagnostic
on:
  push:
    branches: ['qa/mika-budget-remedy-20261008']
permissions:
  contents: read
concurrency:
  group: mika-budget-remedy-20261008
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      BASE: b30c0fba708b5194681cc4bcc8269a0f8b73f3c7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prove unchanged qualified product and save source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mika-fouractor"
          git diff "$BASE" HEAD --binary > "$RUNNER_TEMP/mika-fouractor/source.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/mika-fouractor/sha.txt"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only',process.env.BASE,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean).sort();
          assert.deepEqual(paths,['.github/workflows/mika-budget-remedy.yml','tests/yard-current-four-scene.test.mjs']);
          JS
      - name: Install existing locked dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Diagnose exact initial four-actor frame without weakening failure
        run: |
          set -euo pipefail
          node --test tests/yard-current-four-scene.test.mjs 2>&1 | tee "$RUNNER_TEMP/mika-fouractor/test.log"
      - name: Preserve diagnostic result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mika-fouractor-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/mika-fouractor/
          retention-days: 7
          if-no-files-found: error
