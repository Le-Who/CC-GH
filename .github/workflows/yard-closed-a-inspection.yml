name: Inspect exact closed Yard A
on:
  push:
    branches: [qa/yard-closed-a2-inspection]
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NODE_OPTIONS: ''
      NODE_TLS_REJECT_UNAUTHORIZED: ''
      DEV_AUTH_ENABLED: ''
      DATABASE_URL: ''
      REDIS_URL: ''
      TELEGRAM_BOT_TOKEN: ''
      YARD_PLAYER_WIRING_TEST: ''
      YARD_CANDIDATE_CI: ''
      YARD_EIGHT_PLAYER_CANDIDATE_TEST: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/yard-closed-a-inspection.yml
            /.github/yard-inspection-target.json
            /scripts/yard-inspect-closed-a.mjs
            /tests/yard-inspect-closed-a.test.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Validate exact target before image access
        id: target
        run: |
          node --test tests/yard-inspect-closed-a.test.mjs
          node scripts/yard-inspect-closed-a.mjs --validate-target .github/yard-inspection-target.json
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.commit }}
          path: closed-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/yard-active-contract.mjs
            /scripts/yard-closed-ci-receipt.mjs
            /scripts/browser-ci-groups.mjs
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull only the approved immutable A image
        env:
          A_DIGEST: ${{ steps.target.outputs.digest }}
        run: timeout --foreground --kill-after=5s 120s docker pull "ghcr.io/le-who/cc-gh@${A_DIGEST}"
      - name: Collect pristine A, successful CLOSED receipt and public health
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/yard-inspect-closed-a.mjs --collect .github/yard-inspection-target.json closed-source "$RUNNER_TEMP/yard-a-inspection"
      - uses: actions/upload-artifact@v7
        with:
          name: yard-closed-a-010dd1ede7f435ccaad92545068c495b8a4cf5f3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yard-a-inspection/
          if-no-files-found: error
          retention-days: 14
