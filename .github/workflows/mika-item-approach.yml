name: Mika selected-item candidate
on:
  push:
    branches: ['qa/native-mika-selected-item-20261008']
permissions:
  contents: read
concurrency:
  group: native-mika-selected-item-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      VITE_YARD_MIKA_QA: 'true'
      VITE_YARD_MIKA_ITEM_QA: 'true'
      MIKA_QA_EXPECT_ENABLED: 'true'
      MIKA_QA_EXPECT_ITEM_APPROACH: 'true'
      MIKA_QA_EXPECT_ARRIVAL: 'true'
      VITE_YARD_MIKA_CONTINUATION_QA: 'true'
      MIKA_QA_EXPECT_CONTINUATION: 'true'
      MIKA_QA_EXPECT_SELECTED_UI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked existing dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Check selected-item lifecycle and default/saved owner guards
        run: |
          mkdir -p test-results/mika-normal
          node --test --test-concurrency=1 tests/yard-native-item-command.test.mjs tests/yard-mika-qa-entry.test.mjs tests/yard-mika-qa-async-scene.test.mjs > test-results/mika-normal/source-tests.log
      - name: Collect visible modal feedback rechecks
        run: |
          MIKA_QA_PHASE=collection-ru pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'Mika selected item UI: ru actual footer' --list > test-results/mika-normal/collection-ru.log
          test "$(grep -c 'Mika selected item UI: ru actual footer' test-results/mika-normal/collection-ru.log)" -eq 1
          MIKA_QA_PHASE=collection-cancel pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 --grep 'Mika selected item UI: (selection|cancel) cancels' --list > test-results/mika-normal/collection-cancel.log
          test "$(grep -c 'cancels the current command' test-results/mika-normal/collection-cancel.log)" -eq 2
      - name: Build explicit current-pose candidate, never deployment
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm run build | tee test-results/mika-normal/build.log
          tar -czf test-results/mika-normal/built-module-diagnostic.tar.gz dist/index.html dist/game-loading-graph.json dist/assets/*.js
      - name: Install official Chromium
        id: browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Russian footer busy, arrival and visible refusal feedback
        run: |
          MIKA_QA_PHASE=modal-ru pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'Mika selected item UI: ru actual footer'
      - name: Visible selection and explicit cancellation feedback
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          MIKA_QA_PHASE=modal-cancel pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 --grep 'Mika selected item UI: (selection|cancel) cancels'
      - name: Preserve original bounded current-pose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mika-selected-item-${{ github.sha }}
          path: test-results/mika-normal/
          retention-days: 7
          if-no-files-found: error
