name: Mika settled-checkpoint candidate
on:
  push:
    branches: ['qa/native-mika-checkpoint-20261008']
permissions:
  contents: read
concurrency:
  group: native-mika-checkpoint-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      VITE_YARD_MIKA_QA: 'true'
      VITE_YARD_MIKA_ITEM_QA: 'true'
      MIKA_QA_EXPECT_ENABLED: 'true'
      MIKA_QA_EXPECT_ITEM_APPROACH: 'true'
      MIKA_QA_EXPECT_ARRIVAL: 'true'
      VITE_YARD_MIKA_CONTINUATION_QA: 'true'
      MIKA_QA_EXPECT_CONTINUATION: 'true'
      MIKA_QA_EXPECT_SELECTED_UI: 'true'
      MIKA_QA_EXPECT_CHECKPOINT: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked existing dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Check bounded recipe, checkpoint transaction and owner integration
        run: |
          mkdir -p test-results/mika-normal
          node --test --test-concurrency=1 tests/yard-mika-native-settled-recipe.test.mjs tests/yard-native-checkpoint-command.test.mjs tests/yard-native-item-command.test.mjs tests/yard-mika-checkpoint-layer.test.mjs tests/yard-mika-qa-entry.test.mjs tests/yard-mika-qa-async-scene.test.mjs tests/yard-mika-native-contract.test.mjs > test-results/mika-normal/source-tests.log
          node --import ./tests/yard-inventory-only-loader.mjs --test --test-concurrency=1 tests/yard-mika-native-checkpoint.test.mjs > test-results/mika-normal/server-checkpoint-tests.log
      - name: Collect one compact save and reload diagnostic
        run: |
          MIKA_QA_PHASE=collection-checkpoint pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'Mika checkpoint UI: RU acknowledged save' --list > test-results/mika-normal/collection-checkpoint.log
          test "$(grep -c 'Mika checkpoint UI: RU acknowledged save' test-results/mika-normal/collection-checkpoint.log)" -eq 1
      - name: Build explicit current-pose candidate, never deployment
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm run build | tee test-results/mika-normal/build.log
          tar -czf test-results/mika-normal/built-module-diagnostic.tar.gz dist/index.html dist/game-loading-graph.json dist/assets/*.js
      - name: Install official Chromium
        id: browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Actual footer save, reload and continue from the committed pose
        env:
          YARD_NATIVE_MIKA_CHECKPOINT_QA: 'true'
        run: |
          MIKA_QA_PHASE=checkpoint-compact pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'Mika checkpoint UI: RU acknowledged save'
      - name: Preserve original bounded current-pose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mika-checkpoint-${{ github.sha }}
          path: test-results/mika-normal/
          retention-days: 7
          if-no-files-found: error
