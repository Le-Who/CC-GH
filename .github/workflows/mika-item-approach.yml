name: Mika item arrival candidate
on:
  push:
    branches: ['qa/native-mika-arrival-20261008']
permissions:
  contents: read
concurrency:
  group: native-mika-arrival-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      VITE_YARD_MIKA_QA: 'true'
      VITE_YARD_MIKA_ITEM_QA: 'true'
      MIKA_QA_EXPECT_ENABLED: 'true'
      MIKA_QA_EXPECT_ITEM_APPROACH: 'true'
      MIKA_QA_EXPECT_ARRIVAL: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked existing dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Check arrival seam, contacts, complete admission and accepted cruise compatibility
        run: |
          mkdir -p test-results/mika-normal
          node --test --test-concurrency=1 tests/yard-mika-arrival.test.mjs tests/yard-mika-item-arrival.test.mjs tests/yard-mika-item-approach.test.mjs tests/yard-mika-qa-route.test.mjs tests/yard-mika-qa-entry.test.mjs tests/yard-mika-qa-layer.test.mjs tests/yard-mika-qa-async-layer.test.mjs tests/yard-mika-qa-async-scene.test.mjs tests/yard-mika-native-contract.test.mjs tests/yard-mika-native-cruise-replay.test.mjs tests/yard-mika-native-pip-compat.test.mjs tests/yard-renderer-chunk.test.mjs > test-results/mika-normal/source-tests.log
      - name: Collect exact bounded six-second browser cases
        run: |
          MIKA_QA_PHASE=collection-arrival pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 --project portrait390 --project landscape844 --grep 'real pixels|current persisted item' --list > test-results/mika-normal/collection-arrival.log
          test "$(grep -c 'current persisted item at' test-results/mika-normal/collection-arrival.log)" -eq 6
          MIKA_QA_PHASE=collection-cancel pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 --grep 'target relocation during arrival' --list > test-results/mika-normal/collection-cancel.log
          grep -F 'target relocation during arrival' test-results/mika-normal/collection-cancel.log
      - name: Build explicit arrival candidate, never deployment
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm run build | tee test-results/mika-normal/build.log
          tar -czf test-results/mika-normal/built-module-diagnostic.tar.gz dist/index.html dist/game-loading-graph.json dist/assets/*.js
      - name: Install official Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Compact six-second approach-to-standing diagnostic
        run: MIKA_QA_PHASE=arrival-compact pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'real pixels'
      - name: Same three current placements in the normal cameras
        run: MIKA_QA_PHASE=arrival-matrix pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 --project portrait390 --project landscape844 --grep 'real pixels|current persisted item'
      - name: Actual clean six-second recording and arrival relocation
        run: |
          MIKA_QA_PHASE=arrival-clean pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait390 --grep 'clean 1x'
          MIKA_QA_PHASE=arrival-cancel pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project portrait320 --grep 'target relocation during arrival'
      - name: Preserve original bounded arrival evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mika-item-arrival-${{ github.sha }}
          path: test-results/mika-normal/
          retention-days: 7
          if-no-files-found: error
