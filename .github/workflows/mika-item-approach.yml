name: Mika current-pose candidate
on:
  push:
    branches: ['qa/native-mika-current-pose-20261008']
permissions:
  contents: read
concurrency:
  group: native-mika-current-pose-20261008
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
      VITE_YARD_PIP_PREVIEW: 'true'
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
      VITE_YARD_MIKA_QA: 'true'
      VITE_YARD_MIKA_ITEM_QA: 'true'
      MIKA_QA_EXPECT_ENABLED: 'true'
      MIKA_QA_EXPECT_ITEM_APPROACH: 'true'
      MIKA_QA_EXPECT_ARRIVAL: 'true'
      VITE_YARD_MIKA_CONTINUATION_QA: 'true'
      MIKA_QA_EXPECT_CONTINUATION: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked existing dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Check current-pose contacts, complete admission and unchanged cruise/Pip contracts
        run: |
          mkdir -p test-results/mika-normal
          node --test --test-concurrency=1 tests/yard-mika-departure.test.mjs tests/yard-mika-turn-away.test.mjs tests/yard-mika-current-pose.test.mjs tests/yard-mika-arrival.test.mjs tests/yard-mika-item-arrival.test.mjs tests/yard-mika-item-approach.test.mjs tests/yard-mika-qa-route.test.mjs tests/yard-mika-qa-entry.test.mjs tests/yard-mika-qa-layer.test.mjs tests/yard-mika-qa-async-layer.test.mjs tests/yard-mika-qa-async-scene.test.mjs tests/yard-mika-native-contract.test.mjs tests/yard-mika-native-cruise-replay.test.mjs tests/yard-mika-native-pip-compat.test.mjs tests/yard-renderer-chunk.test.mjs > test-results/mika-normal/source-tests.log
      - name: Collect compact clean latency diagnostic
        run: |
          MIKA_QA_PHASE=collection-clean MIKA_QA_CLEAN_CONTINUATION=true pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'clean two-item recording to 88,62' --list > test-results/mika-normal/collection-clean.log
          test "$(grep -c 'clean two-item recording to 88,62' test-results/mika-normal/collection-clean.log)" -eq 1
      - name: Build explicit current-pose candidate, never deployment
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm run build | tee test-results/mika-normal/build.log
          tar -czf test-results/mika-normal/built-module-diagnostic.tar.gz dist/index.html dist/game-loading-graph.json dist/assets/*.js
      - name: Install official Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Inspect actual request/RAF/cache evidence before expanding this rerun.
      - name: Compact clean same-actor latency and lifetime diagnostic
        run: MIKA_QA_PHASE=current-pose-clean-compact MIKA_QA_CLEAN_CONTINUATION=true pnpm exec playwright test yard-mika-normal-qa.spec.js --config playwright.mika-normal-qa.config.mjs --project compact-diagnostic --grep 'clean two-item recording to 88,62'
      - name: Preserve original bounded current-pose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mika-current-pose-${{ github.sha }}
          path: test-results/mika-normal/
          retention-days: 7
          if-no-files-found: error
