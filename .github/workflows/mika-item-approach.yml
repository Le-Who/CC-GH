name: Clean Yard replacement candidate
on:
  push:
    branches: ['qa/clean-yard-only-20261009']
permissions:
  contents: read
concurrency:
  group: clean-yard-only-20261009
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: ''
      REDIS_URL: ''
      NODE_OPTIONS: ''
      VITE_YARD_SAVED_VISITS: 'false'
      VITE_YARD_PAINTED_FOOD_TRIAL: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked existing dependencies
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile
      - name: Verify clean owner, preserved resources and canonical state
        run: |
          mkdir -p test-results/yard-clean
          pnpm run test:yard-clean > test-results/yard-clean/source-tests.log
          node --test --test-concurrency=1 tests/yard-clean-media-budget.test.mjs tests/yard-clean-vendor.test.mjs tests/yard-renderer-chunk.test.mjs tests/yard-mika-native-pip-compat.test.mjs tests/yard-family-media.test.mjs > test-results/yard-clean/closure-source-tests.log
          node --test --test-concurrency=1 tests/assets-pipeline.test.js tests/asset-retirement.test.js tests/perf-build-guard.test.js > test-results/yard-clean/asset-retirement-tests.log
      - name: Collect one compact normal clean entry
        run: |
          pnpm exec playwright test --config playwright.yard-clean.config.mjs --project compact-diagnostic --list > test-results/yard-clean/collection.log
          test "$(grep -c 'Clean Yard normal entry:' test-results/yard-clean/collection.log)" -eq 1
      - name: Build ordinary clean route and verify exact emitted closure
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm run build | tee test-results/yard-clean/build.log
          node scripts/yard-clean-delivery.mjs dist > test-results/yard-clean/delivery.json
          node --test tests/yard-lazy-built.test.mjs tests/yard-contract-data.test.mjs > test-results/yard-clean/built-closure-tests.log
          pnpm run perf:guard:build > test-results/yard-clean/budget.log
          tar -czf test-results/yard-clean/built-module-diagnostic.tar.gz dist/index.html dist/game-loading-graph.json dist/yard-pip-vendor-report.json dist/assets/*.js
      - name: Full package test command against this exact replacement
        id: package
        timeout-minutes: 8
        continue-on-error: true
        run: pnpm test > test-results/yard-clean/package-tests.log 2>&1
      - name: Install official Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Normal route with current canonical item, cancelled move and reload
        run: pnpm exec playwright test --config playwright.yard-clean.config.mjs --project compact-diagnostic
      - name: Require the full package test result
        if: always() && steps.package.outcome == 'failure'
        run: exit 1
      - name: Preserve exact clean replacement diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yard-clean-${{ github.sha }}
          path: test-results/yard-clean/
          retention-days: 7
          if-no-files-found: error
