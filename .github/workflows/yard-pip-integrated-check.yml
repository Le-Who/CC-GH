name: Bounded actual Yard optional Pip integration
on:
  push:
    branches: ['qa/yard-pip-integrated-check-20261006']
permissions:
  contents: read
concurrency:
  group: actual-yard-pip-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-yard-pip:
    if: github.run_attempt == 1 && github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify immutable parent and candidate, and existing Xvfb
        id: verify
        run: |
          test "$(git rev-parse HEAD^)" = d691e7a26fa726091e363702feade8cfe291456d
          command -v xvfb-run
          node qa/yard-pip-integration/run.mjs --verify-only
      - name: Install ffmpeg from official Ubuntu repositories
        id: ffmpeg
        run: |
          sudo apt-get update
          apt-cache policy ffmpeg
          sudo apt-get install --no-install-recommends -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact locked ordinary QA dependencies
        id: dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Restore approved public raster bytes and build actual source
        id: build
        run: |
          node qa/yard-corrected-scene/browser/materialize-transport.mjs
          node --import ./qa/yard-pip-integration/candidate/tests/register-vendor.mjs --test qa/yard-pip-integration/candidate/tests/*.test.mjs qa/yard-pip-integration/candidate/vendor/r5/tests/yard-atlas-working-set.test.mjs
          node qa/yard-pip-integration/build.mjs
      - name: One finite real-UI native Chromium pass
        id: browser
        timeout-minutes: 4
        run: xvfb-run -a node qa/yard-pip-integration/run.mjs
      - name: Preserve setup failure context and enforce eight MiB cap
        id: cap
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          FFMPEG_OUTCOME: ${{ steps.ffmpeg.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('qa/yard-pip-integration/results'); p.mkdir(parents=True,exist_ok=True)
          setup={k:os.environ.get(k) for k in ['VERIFY_OUTCOME','FFMPEG_OUTCOME','DEPENDENCIES_OUTCOME','BUILD_OUTCOME','BROWSER_OUTCOME']}
          (p/'setup-outcomes.json').write_text(json.dumps(setup,indent=2))
          if not (p/'report.json').exists():
            (p/'report.json').write_text(json.dumps({'status':'SETUP_OR_EARLY_FAILURE','setup':setup,'browserAcceptance':'NOT_ESTABLISHED','note':'Check the named workflow step log. This file preserves absence of native evidence; it is not a successful check.'},indent=2))
          size=sum(f.stat().st_size for f in p.rglob('*') if f.is_file())
          assert size <= 8*1024*1024, 'Artifact cap exceeded; upload refused without deleting original evidence'
          print('Artifact bytes:',size)
          PY
      - uses: actions/upload-artifact@v7
        if: always() && steps.cap.outcome == 'success'
        with:
          name: actual-yard-pip-${{ github.sha }}-${{ github.run_attempt }}
          path: qa/yard-pip-integration/results/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
