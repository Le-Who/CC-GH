services:
  app:
    image: ghcr.io/${GHCR_REPO:-user/game-hub}:latest
    container_name: ccgh-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-pgpass}@postgres:5432/${POSTGRES_DB:-gamehub}
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - CUSTOM_DOMAIN=${CUSTOM_DOMAIN}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - APP_BUILD_ID=${APP_BUILD_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DEV_AUTH_ENABLED=false
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-18080}:8080"
    networks:
      - ccgh-internal

  postgres:
    image: postgres:15-alpine
    container_name: ccgh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpass}
      POSTGRES_DB: ${POSTGRES_DB:-gamehub}
    volumes:
      - ccgh-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-gamehub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ccgh-internal

  redis:
    image: redis:7-alpine
    container_name: ccgh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ccgh-redis-data:/data
    networks:
      - ccgh-internal

networks:
  ccgh-internal:
    name: ccgh-internal

volumes:
  ccgh-pg-data:
    name: ccgh-pg-data
  ccgh-redis-data:
    name: ccgh-redis-data
