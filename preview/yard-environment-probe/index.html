<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Yard environment scene probe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202c29;color:#fff8dc;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}header{padding:8px 12px;background:#172620;flex:none;font-size:12px;line-height:1.35}header strong{display:block;color:#ffe29a;font-size:14px}#stage{position:relative;flex:1;min-height:0;min-width:0;background:#273c32}canvas{display:block;width:100%;height:100%}footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:#172620;flex:none}button{min-height:44px;min-width:60px;padding:6px 14px;border:0;border-radius:8px;background:#ffe09a;color:#233326;font:600 14px system-ui}button:disabled{opacity:.5}label{display:flex;align-items:center;min-height:44px;font-size:12px;gap:4px}input{width:20px;height:20px}#status{font-size:11px;flex:1;min-width:84px}#error{position:absolute;inset:12px auto auto 12px;color:#ffdfdf;background:#722;padding:8px;max-width:90%}#error:empty{display:none}@media(max-height:450px){header{font-size:11px;padding:4px 10px}header strong{font-size:12px}footer{padding:2px 10px}}
