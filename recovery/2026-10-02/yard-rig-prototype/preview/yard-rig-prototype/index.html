<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mika articulated rig probe</title><link rel="stylesheet" href="/probe.css"></head><body><main><header><h1>Mika • articulated 2D probe</h1><p>Candidate art and contact review. No production data, visits, rewards or save writes</p></header><div class="controls"><button id="toggle">Pause</button><button id="restart">Restart</button><label>Clip<select id="mode"><option value="walk">Walk</option><option value="play">Touch mouse</option></select></label><label>Speed<select id="rate"><option value="1">1×</option><option value="0.25">0.25×</option><option value="0">Pose hold</option></select></label><label><input id="bones" type="checkbox"> Joints &amp; contacts</label></div><div class="stage"><canvas id="scene" aria-label="Animated Mika rig with four independently articulated legs"></canvas></div><div class="scrub"><label for="timeline">Inspect pose</label><input id="timeline" type="range" min="0" max="2000" step="1" value="0"></div><output id="status" aria-live="off">Loading local parts…</output><aside>This is a working Canvas2D rig inspector. It is not the final Pixi Yard. Browser visual acceptance is pending. The earlier independent image frames are not used.</aside></main><script type="module" src="/app.js"></script></body></html>
