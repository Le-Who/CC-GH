<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f2e5"><title>Тихий двор — preview</title><link rel="stylesheet" href="style.css"></head><body><main class="yard-app" id="app"><header class="topbar"><h1>Тихий двор</h1><span class="preview-tag">PREVIEW</span><span class="wallet" id="wallet" aria-live="polite">● —</span></header><section class="scene" id="scene" aria-label="Двор с питомцами и предметами"><canvas id="yard" tabindex="0" aria-label="Игровой двор. При перестановке: стрелки двигают предмет, Enter подтверждает, Escape отменяет."></canvas><div class="placement-tools" id="placement-tools" hidden><button id="cancel-placement">Отмена</button><button id="confirm-placement">Поставить</button></div></section><div class="status" id="status" role="status">Загрузка двора…</div><nav class="actions" aria-label="Действия во дворе"><button data-panel="food"><strong>Еда</strong><span id="food-summary">Миска</span></button><button data-panel="decor"><strong>Предметы</strong><span id="decor-summary">Обустройство</span></button><button data-panel="guests"><strong>Гости</strong><span id="guest-summary">Ждём друзей</span></button></nav><dialog id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title"><header><h2 id="panel-title"></h2><button id="close-panel" aria-label="Закрыть">×</button></header><div id="panel-content"></div></dialog><div id="fatal" hidden></div></main><script type="module" src="app.mjs"></script></body></html>
